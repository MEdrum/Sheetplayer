<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>Sheetplayer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar"><strong>Sheetplayer</strong><span id="status" role="status">Loading catalog…</span><button id="clear" type="button">Clear data</button></header>
  <main class="layout">
    <aside class="catalog" aria-label="Score catalog"><h1>Scores</h1><input id="filter" type="search" placeholder="Filter scores" aria-label="Filter scores"><div id="scores"></div></aside>
    <section class="player" aria-label="Score player">
      <div class="player-head"><div><p class="eyebrow">Now selected</p><h2 id="title">Choose a score</h2></div><button id="fullscreen" type="button">Fullscreen</button></div>
      <div id="empty" class="empty">Select a score from the catalog to begin.</div>
      <div id="score" class="score" hidden><div class="staff"><span>𝄞</span><span class="notes">♩ ♪ ♫ ♩ ♫ ♪</span></div><p id="format"></p><p class="notice">Score rendering is client-side. Connect a MusicXML or MuseScore-compatible renderer to display notation.</p></div>
      <div class="controls"><button id="play" type="button" disabled>▶ Play</button><label>Tempo <input id="tempo" type="range" min="20" max="300" value="100"><output id="tempo-value">100 BPM</output></label></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
